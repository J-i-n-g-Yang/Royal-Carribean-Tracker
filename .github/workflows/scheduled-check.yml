name: Scheduled Cruise Price Check

# Runs once daily with no server needed anywhere — GitHub's own runners
# execute check_runner.run_check() directly via scheduled_run.py, the same
# function the Flask API and manual UI checks use.
#
# NOTE (public repo): GitHub Actions run logs are visible to anyone on a
# public repo. scheduled_run.py masks account credentials and suppresses the
# engine's verbose console output specifically because of this — see the
# comments at the top of that file before changing how it's invoked.
on:
  schedule:
    # 08:17 UTC daily (= 4:17 PM Singapore, UTC+8 with no DST). Deliberately
    # off the top of the hour: GitHub Actions cron is best-effort, and exact
    # round times (like :00) are documented as the highest-contention slot
    # since most repos default to them — an offbeat minute avoids that
    # pile-up. This does NOT protect against genuine platform incidents
    # (see the drift check below), only routine load-based queueing delay.
    - cron: '17 8 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab to test this

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for schedule drift
        # Only meaningful for cron-triggered runs — a manual workflow_dispatch
        # isn't "late" against anything. Flags (via a visible ::warning::
        # annotation + step summary) when GitHub's schedule event fired more
        # than 2 hours later than the intended 08:17 UTC target — the usual
        # sign of a GitHub-side Actions incident/backlog, not a config
        # problem here. See githubstatus.com for confirmation on any given
        # day. This never fails or skips the run; it just surfaces the delay.
        if: github.event_name == 'schedule'
        run: |
          TARGET_MINS=$((8 * 60 + 17))
          NOW_MINS=$(date -u +'%H:%M' | awk -F: '{print $1 * 60 + $2}')
          DIFF=$((NOW_MINS - TARGET_MINS))
          if [ "$DIFF" -lt 0 ]; then DIFF=$((DIFF + 1440)); fi
          echo "Scheduled for 08:17 UTC, actually started $(date -u +'%H:%M') UTC (${DIFF} min drift)"
          if [ "$DIFF" -gt 120 ]; then
            echo "::warning::Scheduled run started ${DIFF} minutes late (target 08:17 UTC, actual $(date -u +'%H:%M') UTC). This is usually a GitHub Actions-side delay/incident, not a problem with this repo — check https://www.githubstatus.com for that day."
            echo "⚠️ **Schedule drift:** started ${DIFF} min late (target 08:17 UTC, actual $(date -u +'%H:%M') UTC). Likely a GitHub-side delay — check [githubstatus.com](https://www.githubstatus.com)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Schedule drift: ${DIFF} min (within normal range)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore run history
        # backend/data/history.json is .gitignored (see .gitignore) since it's
        # personal run data, not source — so on a public repo it must never be
        # committed. actions/cache keeps it available across scheduled runs
        # (so "what changed since last run" diffing keeps working) without it
        # ever touching the repository itself.
        uses: actions/cache@v4
        with:
          path: backend/data
          key: rc-history-${{ github.run_id }}
          restore-keys: |
            rc-history-

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run scheduled price check
        working-directory: backend
        env:
          RC_ACCOUNTS_JSON: ${{ secrets.RC_ACCOUNTS_JSON }}
          NOTIFY_URLS: ${{ secrets.NOTIFY_URLS }}
          # Optional — set this secret to track watchlist items and prospective
          # cruises on every scheduled run. Copy the contents of
          # backend/secrets/watchlist.example.json, fill in your values, and
          # paste the whole JSON object as the RC_WATCHLIST_JSON secret in
          # your repo Settings → Secrets and variables → Actions.
          RC_WATCHLIST_JSON: ${{ secrets.RC_WATCHLIST_JSON }}
        run: python scheduled_run.py

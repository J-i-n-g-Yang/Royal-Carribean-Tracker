name: Deploy Frontend to GitHub Pages

# Deploys the React frontend (frontend/) to GitHub Pages whenever changes
# are pushed to the master branch, or when triggered manually.
#
# SETUP REQUIRED (one-time):
#   Go to your repo → Settings → Pages → under "Source", select "GitHub Actions"
#
# Once deployed, your app will be live at:
#   https://J-i-n-g-Yang.github.io/Royal-Carribean-Tracker

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'                            # frontend code changes
      - '.github/workflows/deploy.yml'           # or the workflow itself changes
  workflow_dispatch: {}        # allows manual trigger from the Actions tab

# Grant the GITHUB_TOKEN the permissions needed to push to gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build React app
        working-directory: frontend
        env:
          # Suppresses the "treat warnings as errors" behaviour of react-scripts
          # so minor ESLint warnings don't fail the build in CI.
          CI: false
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build
          # Keeps the gh-pages branch clean — only the latest build lives there
          force_orphan: true
          # Optional: sets a custom commit message in the gh-pages branch
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual trigger' }}"

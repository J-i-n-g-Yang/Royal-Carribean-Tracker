name: Deploy

# Deploys the React frontend (frontend/) to GitHub Pages whenever changes
# are pushed to the master branch, or when triggered manually.
#
# SETUP REQUIRED (one-time):
#   Go to your repo → Settings → Pages → under "Source", select "GitHub Actions"
#
# Once deployed, your app will be live at:
#   https://J-i-n-g-Yang.github.io/Royal-Carribean-Tracker

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  # ── Build & deploy main ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false
          PUBLIC_URL: /Royal-Carribean-Tracker

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          destination_dir: .        # root of gh-pages branch

  # ── Build & deploy preview for every other branch ─────────────────────────
  deploy-preview:
    name: Deploy Branch Preview
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Set branch slug
        id: slug
        # Strips refs/heads/ and replaces / with - so branch names are URL-safe
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SLUG="${BRANCH//\//-}"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "Preview will be at: /Royal-Carribean-Tracker/preview/$SLUG"

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false
          # Tells React where assets will be served from
          PUBLIC_URL: /Royal-Carribean-Tracker/preview/${{ steps.slug.outputs.slug }}

      - name: Deploy to preview subfolder
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          destination_dir: preview/${{ steps.slug.outputs.slug }}
          keep_files: true          # don't wipe other previews or production

      - name: Post preview URL as commit status
        uses: actions/github-script@v7
        with:
          script: |
            const slug = '${{ steps.slug.outputs.slug }}';
            const repo = context.repo;
            const sha  = context.sha;
            const url  = `https://${repo.owner}.github.io/${repo.repo}/preview/${slug}`;
            await github.rest.repos.createCommitStatus({
              owner:       repo.owner,
              repo:        repo.repo,
              sha:         sha,
              state:       'success',
              target_url:  url,
              description: 'Preview deployed',
              context:     'Preview URL',
            });
            console.log(`Preview URL: ${url}`);
